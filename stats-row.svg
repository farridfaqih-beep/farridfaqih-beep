<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="Repositories, commits in the last year, pull requests and stars received">
<style>.m{font-family:'Fira Code','JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace}.s{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style>
<rect x="0.75" y="0.75" width="898.5" height="94.5" rx="14" fill="#0B1020" stroke="#00D9FF" stroke-opacity="0.55" stroke-width="1.5"/>
<text class="s" x="24" y="38" font-size="13" fill="#E6F1FF">Repositories</text><text class="s" x="24" y="73" font-size="32" fill="#00D9FF" opacity="0">–<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.00s" fill="freeze"/></text>
<line x1="229" y1="22" x2="229" y2="74" stroke="#1B2D50"/><text class="s" x="243" y="38" font-size="13" fill="#E6F1FF">Commits in the last year</text><text class="s" x="243" y="73" font-size="32" fill="#00D9FF" opacity="0">–<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.12s" fill="freeze"/></text>
<line x1="448" y1="22" x2="448" y2="74" stroke="#1B2D50"/><text class="s" x="462" y="38" font-size="13" fill="#E6F1FF">Pull requests</text><text class="s" x="462" y="73" font-size="32" fill="#00D9FF" opacity="0">–<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.24s" fill="freeze"/></text>
<line x1="667" y1="22" x2="667" y2="74" stroke="#1B2D50"/><text class="s" x="681" y="38" font-size="13" fill="#E6F1FF">Stars received</text><text class="s" x="681" y="73" font-size="32" fill="#00D9FF" opacity="0">–<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.36s" fill="freeze"/></text>
</svg>
